# Runtime composition for deepseek-tui's subprocess agent.
# stdout is reserved for JSON-RPC — do not add console loggers.

- id: sdk-jsonrpc-server
  name: "@deepseek-ai/dsh-sdk-jsonrpc-server"

- id: attachments
  name: "@deepseek-ai/dsh-attachment-local"

# OpenCode-style user provider configuration. The llm-pi-ai namespace in this
# file may add gateways or override any catalog route live without a restart.
- id: settings
  name: "@deepseek-ai/dsh-settings-file"
  config:
    path: !!js ((process.env.DEEPSEEK_TUI_CONFIG ?? ((process.env.XDG_CONFIG_HOME ?? ((process.env.HOME ?? '.') + '/.config')) + '/deepseek-tui/providers.yaml')))

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      # Installed pi-ai catalog routes. Empty profiles inherit native endpoint,
      # protocol, models, and environment-based credential discovery.
      amazon-bedrock: {}
      ant-ling: {}
      anthropic: {}
      azure-openai-responses: {}
      cerebras: {}
      cloudflare-ai-gateway: {}
      cloudflare-workers-ai: {}
      deepseek: {}
      fireworks: {}
      github-copilot: {}
      google: {}
      google-vertex: {}
      groq: {}
      huggingface: {}
      kimi-coding: {}
      minimax: {}
      minimax-cn: {}
      mistral: {}
      moonshotai: {}
      moonshotai-cn: {}
      nvidia: {}
      openai: {}
      openai-codex: {}
      opencode: {}
      opencode-go: {}
      openrouter: {}
      qwen-token-plan-cn: {}
      together: {}
      vercel-ai-gateway: {}
      xai: {}
      xiaomi: {}
      xiaomi-token-plan-ams: {}
      xiaomi-token-plan-cn: {}
      xiaomi-token-plan-sgp: {}
      zai: {}
      zai-coding-cn: {}

      qwen-token-plan:
        baseURL: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
        modelOverrides:
          qwen3.8-max-preview:
            contextWindow: 196608
        reasoning: medium

      # OpenAI-compatible router on the LAN box (localhost = localhost), mirroring
      # ~/.pi/agent/models.json. No auth; tool calls and reasoning efforts pass
      # through to the served model.
      local-llm-router:
        displayName: Local LLM Router
        api: openai-completions
        baseURL: http://localhost:3200/v1
        # pi-ai refuses an openai-completions request with neither api key nor
        # Authorization header; the router checks neither, so carry a bearer it
        # ignores. LOCAL_LLM_API_KEY overrides the placeholder if the box ever
        # grows real auth.
        headers:
          Authorization: !!js ('Bearer ' + (process.env.LOCAL_LLM_API_KEY ?? 'dummy-local-llm'))
        # The template only reasons when reasoning_effort is present, so the
        # route sends its default level on every request.
        reasoning: xhigh
        models:
          - id: router
            name: Qwen3.6_fable_711_27b
            contextWindow: 196608
            maxTokens: 49152
            input: [text]
            # The served template accepts exactly these reasoning_effort values
            # (xhigh is its default); anything else raises a Jinja error, so no
            # other level is offered and there is no off switch.
            reasoningEfforts:
              low: low
              medium: medium
              high: xhigh
              xhigh: xhigh

- id: commands
  name: "@deepseek-ai/dsh-commands"

- id: user-approval
  name: "@deepseek-ai/dsh-user-approval"
  config:
    policy: ask

- id: user-questions
  name: "@deepseek-ai/dsh-user-questions"

# Named sandbox+approval bundles the user can switch between, instead of
# answering every approval one at a time. Needs a confining ctx.shell, so it
# must load after the sandbox stack.
- id: permission-presets
  name: "@deepseek-ai/dsh-permission-presets"

- id: subprocess
  name: "@deepseek-ai/dsh-subprocess-local"

# ── Sandbox: confine what the shell and filesystem tools may touch ───────────
# Order matters: the sandbox service and its provider must resolve before the
# executor that injects them.

# Local runner: seatbelt (sandbox-exec) on macOS, bwrap/landlock on Linux.
# An empty runnerCommand lets the provider probe and pick per platform.
- id: sandbox-local
  name: "@deepseek-ai/dsh-sandbox-local"

# Deployment default. The plugin's own default is read-only, which would stop
# the agent writing at all; workspace-write matches the reference preset.
- id: sandbox-policy
  name: "@deepseek-ai/dsh-sandbox-policy"
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

# Confining executor. Registers as ctx.shell IN PLACE OF dsh-bash-local, whose
# Config it inherits verbatim — the tool layer above is unchanged.
- id: bash
  name: "@deepseek-ai/dsh-bash-sandbox"
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 120000

- id: agent-spine
  name: "@deepseek-ai/dsh-agent-spine-demo"
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful coding assistant. Be concise and direct.'
    workspaceContext:
      maxBytes: 131072
    dshHome: !!js dshHomePath()
    skills:
      enabled: true
      filesystem:
        dshHome: !!js dshHomePath()
        agentsHome: !!js dshHomePath('agents')
        bundledSkillDir: !!js dshHomePath('skills/bundled')
    goals:
      domain: {}
      tool: {}
    toolBash:
      enableRunInBackground: true
    toolJobs: {}

- id: sessions
  name: "@deepseek-ai/dsh-session-persistence-jsonl"
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: session-checkpoints
  name: "@deepseek-ai/dsh-session-checkpoint-policy"

# Session index. A real file (not :memory:) so history survives a restart, and
# opened lazily so the cost lands on the first search rather than every boot.
- id: session-query
  name: "@deepseek-ai/dsh-session-query-sqlite"
  config:
    path: .sessions/session-index.sqlite
    openAt: first-search

# The five read-only tools over that index. Without this row the index exists
# but nothing can query it.
- id: tool-session-query
  name: "@deepseek-ai/dsh-tool-session-query"

- id: tool-ask-user
  name: "@deepseek-ai/dsh-tool-ask-user"

# Sandbox-enforcing filesystem backend. Registers as ctx.fs IN PLACE OF
# dsh-fs-local, whose Config it inherits; the model-facing tools are untouched.
- id: fs-local
  name: "@deepseek-ai/dsh-fs-sandbox"
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: "@deepseek-ai/dsh-fs-observation-policy"

- id: tool-fs
  name: "@deepseek-ai/dsh-tool-fs"

- id: tool-fs-search
  name: "@deepseek-ai/dsh-tool-fs-search"
  config:
    sampleOverCapGlobResults: false

- id: tool-str-replace-editor
  name: "@deepseek-ai/dsh-tool-str-replace-editor"
  config:
    maxOutputChars: 16000

- id: tool-todo
  name: "@deepseek-ai/dsh-tool-todo"
  config:
    allowParallelInProgress: true

- id: plan-mode
  name: "@deepseek-ai/dsh-plan-mode"
  config:
    section: |
      You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

      Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

      The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

      Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

      Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

      When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

- id: command-goal
  name: "@deepseek-ai/dsh-command-goal"

- id: tool-goal
  name: "@deepseek-ai/dsh-tool-goal"

- id: token-meter
  name: "@deepseek-ai/dsh-token-meter"

- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  config:
    thresholdRatio: 0.4
    retainRatio: 0.16
    summarizationProvider: qwen-token-plan
    summarizationModel: qwen3.6-flash
    maxTokens: 8192
    compactionRetries: 1

- id: command-compact
  name: "@deepseek-ai/dsh-command-compact"

- id: tool-result-pruner
  name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: timeout-policy
  name: "@deepseek-ai/dsh-tool-call-timeout-policy"

- id: spill-local
  name: "@deepseek-ai/dsh-spill-local"

- id: spill-policy
  name: "@deepseek-ai/dsh-spill-policy"
  config:
    maxInlineBytes: 50000

- id: repeat-tool-reminder
  name: "@deepseek-ai/dsh-repeat-tool-reminder"
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500

- id: session-projection
  name: "@deepseek-ai/dsh-session-projection"

- id: session-title-llm
  name: "@deepseek-ai/dsh-session-title-first-prompt-llm"
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 64
    timeoutMs: 60000

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: qwen-token-plan
    model: qwen3.8-max-preview

- id: credentials-local
  name: "@deepseek-ai/dsh-credentials-local"

- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek"

# ── Schedule: deferred and repeating runs ────────────────────────────────────
- id: schedule
  name: "@deepseek-ai/dsh-schedule"

# ── LSP: language-server queries over ctx.lsp ────────────────────────────────
# The tool's schema is provider-independent; without a registered provider a
# query returns LSP_UNAVAILABLE rather than failing to load.
- id: lsp
  name: "@deepseek-ai/dsh-lsp"

- id: lsp-stdio
  name: "@deepseek-ai/dsh-lsp-stdio"
  config:
    servers:
      typescript:
        command: typescript-language-server
        args: ["--stdio"]
        extensionToLanguage:
          .ts: typescript
          .tsx: typescriptreact
          .mts: typescript
          .cts: typescript
          .js: javascript
          .jsx: javascriptreact
          .mjs: javascript

- id: tool-lsp
  name: "@deepseek-ai/dsh-tool-lsp"

# ── Hooks: lifecycle shell-outs ──────────────────────────────────────────────
# Reads Claude-Code-format hooks from the workspace. A missing file simply
# registers no handlers, so this is safe to mount unconditionally.
- id: hooks-claude-code
  name: "@deepseek-ai/dsh-hooks-claude-code"
  config:
    configPath: !!js ((process.env.DSH_CWD ?? process.cwd()) + '/.claude/settings.json')
    projectDir: !!js process.env.DSH_CWD ?? process.cwd()

# ── Code mode: the model writes a program that calls tools as bindings ───────
# The worker-thread runtime registers ctx.codeRuntime itself; the base package
# is types-only from the composition's point of view.
- id: code-runtime-worker-thread
  name: "@deepseek-ai/dsh-code-runtime-worker-thread"

# ── MCP: third-party servers contributing tools ──────────────────────────────
# Mounted once PER SERVER: serverName and command are both required, so there
# is nothing sensible to mount by default. Copy this row per server:
#
# - id: mcp-<name>
#   name: "@deepseek-ai/dsh-mcp-client"
#   config:
#     transport: stdio
#     serverName: <name>
#     command: <executable>
#     args: []

# ── Terminal: persistent PTY sessions ────────────────────────────────────────
# Long-lived shells the model opens, reads from and sends to, as opposed to the
# one-shot `bash` tool. terminal-bash confines each PTY with the same
# sandboxPolicy as the shell, so it must load after the sandbox stack.

- id: terminals
  name: "@deepseek-ai/dsh-terminal"

- id: terminal-bash
  name: "@deepseek-ai/dsh-terminal-bash"

- id: tool-terminal
  name: "@deepseek-ai/dsh-tool-terminal"

# ── Phase 2: subagents, background jobs, web, ralph ──────────────────────────

# Subagent runtime: provides the `subagents` service the delegation tools inject.
- id: subagent
  name: "@deepseek-ai/dsh-subagent"

# Subagent providers: in-process spawn (fresh child) and fork (inherits history).
- id: subagent-spawn-in-process
  name: "@deepseek-ai/dsh-subagent-spawn-in-process"
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: "@deepseek-ai/dsh-subagent-fork-in-process"
  config:
    providerName: fork

# Subagent control: send_message to a running child + list_agents catalog.
- id: tool-subagent-control
  name: "@deepseek-ai/dsh-tool-subagent-control"

- id: tool-subagent-list-agents
  name: "@deepseek-ai/dsh-tool-subagent-control/list-agents"

# Delegation tools: `subagent` (continuable spawn) and `subagent_fork` (one-shot).
- id: tool-subagent
  name: "@deepseek-ai/dsh-tool-subagent"
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tool-subagent-fork
  name: "@deepseek-ai/dsh-tool-subagent"
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

# Optional direct-child return channel (absent from roots and one-shot agents).
- id: tool-subagent-report
  name: "@deepseek-ai/dsh-tool-subagent-report"

# Web search: DeepSeek official search route (gated on DEEPSEEK_API_KEY).
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: "@deepseek-ai/dsh-web-search-deepseek"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: "@deepseek-ai/dsh-tool-web"
  config:
    fetch: false
    searchTimeoutMs: 60000

# Workflow tool: model-facing workflow orchestration (uses workflowEngine).
- id: tool-workflow
  name: "@deepseek-ai/dsh-tool-workflow"

# Workflow engine: provides `workflowEngine` (required by tool-ralph).
- id: workflow-worker-thread
  name: "@deepseek-ai/dsh-workflow-worker-thread"
  config:
    provider: spawn

# Ralph: fixed fresh-agent iteration loop (renders as a tool).
- id: tool-ralph
  name: "@deepseek-ai/dsh-tool-ralph"
  config:
    subagentProvider: spawn
    maxRounds: 64
