# verify -- the second opinion.
#
# Routed independently of `build` on purpose, so verification is not the same
# model marking its own homework. Both sit on the catalog default today; point
# this at another family once you have credentials for one.
- id: preset-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: qwen-token-plan
    model: qwen3.8-max-preview
